<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sebastijan Grabar - Tour guide</title>

  <!-- Load Pacifico from Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

  <style>
    /* RESET */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      background: #FFF8F0;
      height: 100%;
      overflow-y: auto;
      /* normal scrolling */
      -webkit-overflow-scrolling: touch;
    }

    /* each “page” = full viewport */
    .page {
      width: 100vw;
      min-height: 100vh;
    }

    /* HERO (PAGE 1) */
    .hero {
      color: #2D2D2D;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 1rem;
    }

    .hero h1 {
      font-family: 'Pacifico', cursive;
      font-size: 4.5rem;
      line-height: 1.1;
      text-align: center;
      /* centers even if it wraps */
      opacity: 0;
      animation: fadeIn 1.5s forwards;
    }

    .hero h2 {
      margin-top: .5rem;
      font-size: .9rem;
      font-weight: bold;
      font-family: 'Helvetica';
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: fadeIn 1.5s .8s forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    /* GALLERY (PAGE 2) */
    .gallery {
      display: grid;
      width: 100%;
      height: 100%;
      gap: 8px;
      grid-template-columns: 1.64fr 1fr 1fr;
      grid-template-rows: repeat(3, 1fr);
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-big {
      grid-column: 1;
      grid-row: 1 / span 3
    }

    .img-c2-r1 {
      grid-column: 2;
      grid-row: 1
    }

    .img-c2-r2 {
      grid-column: 2;
      grid-row: 2
    }

    .img-c2-r3 {
      grid-column: 2;
      grid-row: 3
    }

    .img-c3-r1 {
      grid-column: 3;
      grid-row: 1
    }

    .img-c3-r2 {
      grid-column: 3;
      grid-row: 2
    }

    .img-c3-r3 {
      grid-column: 3;
      grid-row: 3
    }

    /* Tablet */
    @media (max-width: 1024px) {
      .gallery {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 100vh repeat(3, 1fr);
      }

      .img-big {
        grid-column: 1 / 3;
        grid-row: 1;
        height: 100vh
      }

      .img-c2-r1 {
        grid-column: 1;
        grid-row: 2
      }

      .img-c2-r2 {
        grid-column: 1;
        grid-row: 3
      }

      .img-c2-r3 {
        grid-column: 1;
        grid-row: 4
      }

      .img-c3-r1 {
        grid-column: 2;
        grid-row: 2
      }

      .img-c3-r2 {
        grid-column: 2;
        grid-row: 3
      }

      .img-c3-r3 {
        grid-column: 2;
        grid-row: 4
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .gallery {
        display: block;
        padding: 8px;
      }

      .gallery img {
        width: 100%;
        height: auto;
        margin-bottom: 8px;
      }
    }

    /* BLANK PAGE 3 */
    .page-3 {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      color: #2D2D2D;
    }
  </style>
</head>

<body>
  <!-- PAGE 1: HERO -->
  <section class="page hero">
    <h1>Sebastijan Grabar</h1>
    <h2>Tour Guide</h2>
  </section>

  <!-- PAGE 2: GALLERY -->
  <section class="page">
    <div class="gallery">
      <img class="img-big" src="./assets/820ead1b2f7ee4d9f724e87a618e0bb5.jpg" alt="">
      <img class="img-c2-r1" src="./assets/d84d74dc4dab09da16f1f3e4a6de8e1f.jpg" alt="">
      <img class="img-c2-r2" src="./assets/5745815c7111fbcb32a5e3d9b49ce2fa.jpg" alt="">
      <img class="img-c2-r3" src="./assets/6e7efaa3799456d67848d5e3745ee2c9.jpg" alt="">
      <img class="img-c3-r1" src="./assets/386b5b26d6ac128252ea6b0f8af0dad4.jpg" alt="">
      <img class="img-c3-r2" src="./assets/a43ad14906156c1c3339d8b7680d5e96.jpg" alt="">
      <img class="img-c3-r3" src="./assets/35cdfb8c0d6739597e8061f70b44bb12.jpg" alt="">
    </div>
  </section>

  <!-- PAGE 3: BLANK -->
  <section class="page page-3">
    <svg xmlns="http://www.w3.org/2000/svg">
      <defs>
        <style>
          .top {
            font-family: 'Pacifico', cursive;
            font-size: 20px;
          }
        </style>

        <!-- original guide -->
        <path id="curveA" d="M20 50 C60 30,120 40,160 100" fill="none" />

        <!-- duplicate path shifted down 10px -->
        <path id="curveB" d="M17 80 C60 60,120 70,160 130" fill="none" />
      </defs>

      <path d="M20 50 C60 30,120 40,160 100" fill="none" stroke="#ff6f00" stroke-width="4" stroke-dasharray="6 8" />

      <!-- text rides along the lowered curveB -->
      <text class="top">
        <textPath fill="#2D2D2D" href="#curveB">Lead&nbsp;the&nbsp;Way</textPath>
      </text>

      <circle cx="160" cy="100" r="14" fill="#ff6f00" />
      <circle cx="160" cy="100" r="5" fill="#ffffff" />
    </svg>
  </section>
</body>

</html>
