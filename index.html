<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description"
    content="Explore Zagreb on memorable walking tours with Sebastijan Grabar. Discover hidden gems, local history, and stunning sights with an expert tour guide. Book your tour now!">
  <title>Sebastijan Grabar - Tour guide</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <style>
    /* RESET */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    /* Lexend Giga ASCII Only */
    @font-face {
      font-family: 'Lexend Giga';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(assets/lexend-giga.woff2) format('woff2');
      unicode-range: U+0000-007F;
    }

    /* Pacifico ASCII Only */
    @font-face {
      font-family: 'Pacifico';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(assets/pacifico.woff2) format('woff2');
      unicode-range: U+0000-007F;
    }

    html,
    body {
      background: #FFF8F0;
      height: 100%;
      overflow-y: auto;
      /* normal scrolling */
      -webkit-overflow-scrolling: touch;
    }

    /* each “page” = full viewport */
    .page {
      width: 100vw;
      min-height: 100vh;
    }

    /* HERO (PAGE 1) */
    .hero {
      position: relative;
      color: #2D2D2D;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 1rem;
    }

    /* 2) style the small logo */
    .hero .svg-logo {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      height: 4rem;
      /* adjust as needed */
      width: auto;
    }

    .hero h1 {
      font-family: 'Pacifico', cursive;
      font-size: 4.5rem;
      line-height: 1.1;
      text-align: center;
      /* centers even if it wraps */
      opacity: 0;
      animation: fadeIn 1s forwards;
    }

    .hero h2 {
      margin-top: 2.5rem;
      font-size: .9rem;
      text-transform: uppercase;
      text-align: center;
      opacity: 0;
      animation: fadeIn 1s .3s forwards;
      font-optical-sizing: auto;
      font-weight: 400;
      font-family: "Lexend Giga", sans-serif;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    /* GALLERY (PAGE 2) */
    .gallery {
      display: grid;
      width: 100%;
      height: 100%;
      gap: 8px;
      grid-template-columns: 1.64fr 1fr 1fr;
      grid-template-rows: repeat(3, 1fr);
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-big {
      grid-column: 1;
      grid-row: 1 / span 3
    }

    .img-c2-r1 {
      grid-column: 2;
      grid-row: 1
    }

    .img-c2-r2 {
      grid-column: 2;
      grid-row: 2
    }

    .img-c2-r3 {
      grid-column: 2;
      grid-row: 3
    }

    .img-c3-r1 {
      grid-column: 3;
      grid-row: 1
    }

    .img-c3-r2 {
      grid-column: 3;
      grid-row: 2
    }

    .img-c3-r3 {
      grid-column: 3;
      grid-row: 3
    }

    /* Tablet */
    @media (max-width: 1024px) {
      .gallery {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 100vh repeat(3, 1fr);
      }

      .img-big {
        grid-column: 1 / 3;
        grid-row: 1;
        height: 100vh
      }

      .img-c2-r1 {
        grid-column: 1;
        grid-row: 2
      }

      .img-c2-r2 {
        grid-column: 1;
        grid-row: 3
      }

      .img-c2-r3 {
        grid-column: 1;
        grid-row: 4
      }

      .img-c3-r1 {
        grid-column: 2;
        grid-row: 2
      }

      .img-c3-r2 {
        grid-column: 2;
        grid-row: 3
      }

      .img-c3-r3 {
        grid-column: 2;
        grid-row: 4
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .gallery {
        display: block;
        padding: 8px;
      }

      .gallery img {
        width: 100%;
        height: auto;
        margin-bottom: 8px;
      }
    }

    /* BLANK PAGE 3 */
    /* PAGE 3 */
    .page-3 {
      display: flex;
      flex-direction: column;
      /* stack .svg-row + a vertically */
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      color: #2D2D2D;
    }

    /* .svg-row as a horizontal list of SVGs that wraps if not enough space */
    .page-3 .svg-row {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      /* <-- Allow SVGs to wrap under each other */
      margin-bottom: 1rem;
    }

    /* style for the link */
    .page-3 a {
      font-family: "Lexend Giga", sans-serif;
      font-size: 1rem;
      color: #ff6f00;
      text-decoration: none;
      margin-top: 1rem;
    }

    .page-3 a:hover {
      opacity: 0.7;
      text-decoration: underline;
    }

    .page-3 .svg-logo {
      min-width: 10rem;
      flex: 1 1 10rem;
    }
  </style>
</head>
